<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generique Blog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>

    <!--Connecting fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carattere&family=Ephesis&family=Fleur+De+Leah&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="heading-container">
            <a href="index.html" id="heading">
                <img src="res/uitm_logo.svg" alt="UITM logo">
                <h1 id="blog-title">Generique Blog</h1>
            </a>
        </div>
        <form id="searchbar" name="searchbar" onsubmit="search()">
            <input type="text" id="search-content" name="search-content" placeholder="Search by title...">
            <input type="submit" class="icon" value placeholder="🔎">
        </form>
        <div id="user-actions">
        </div>
    </header>
    <div id="feed">
    </div>
    <!--OVERLAY TESTING BELOW-->
    <div class="modal" id="modal">
        <div class="modal-header">
            <div class="title">New entry:</div>
            <button onclick="makePost()">Post</button>
            <button onclick="closeCreatorPopup()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="new-post-error"></div>
            <input type="text" id="new-post-title" placeholder="Title...">
            <textarea id="new-post-content" rows="4" cols="50"></textarea>
        </div>
    </div>
    <div id="overlay" onclick="closeCreatorPopup()"></div>
</body>
</html>
