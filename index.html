<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generique Blog</title>
    <link rel="icon" href="res/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>

    <!--Connecting fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carattere&family=Ephesis&family=Fleur+De+Leah&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="heading-container">
            <a href="index.html" id="heading">
                <img src="res/uitm_logo.svg" alt="UITM logo">
                <h1 id="blog-title">Generique Blog</h1>
            </a>
        </div>
        <form id="searchbar" name="searchbar" onsubmit="search()">
            <input type="text" id="search-content" name="search-content" placeholder="Search by title...">
            <input type="submit" class="icon" value>
        </form>
        <div id="user-actions"></div>
    </header>
    <div id="auth-box">
        <div id="login-form">
            <form action="login" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <a href="#" onclick="showRegister()">Register</a>
        </div>
        <div id="register-form" style="display:none;">
            <form action="register" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                <button type="submit">Register</button>
            </form>
            <a href="#" onclick="showLogin()">Back to Login</a>
        </div>
    </div>
    <div id="feed"></div>
    <div class="modal" id="modal">
        <div class="modal-header">
            <input type="text" id="new-post-title" placeholder="Title...">
            <div id="modal-buttons">
                <button id="submit-button" onclick="makePost(-1)"></button>
                <button id="cancel-button" onclick="closeCreatorPopup()"></button>
            </div>
        </div>
        <div class="modal-body">
            <textarea id="new-post-content" rows="4" cols="50" placeholder="How is it going?"></textarea>
            <div id="new-post-error"></div>
        </div>
    </div>
    <div id="overlay" onclick="closeCreatorPopup()"></div>
    <div id="loading" class="active"></div>
</body>
</html>
