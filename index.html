<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generic Blog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ephesis&family=Fleur+De+Leah&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" id="heading">
            <img src="res/uitm_logo.svg" alt="UITM logo">
            <h1 id="blog-title">Generic Blog</h1>
        </a>
        <form id="searchbar" name="searchbar" onsubmit="search()">
            <input type="text" name="search-content">
            <input type="submit" value="🔎">
        </form>
        <div id="user-actions">
            <button onClick=logIn()>Log in</button>
            <button onClick=register()>Register</button>
        </div>
    </header>
    <div id="feed">
        <div class="post">
            <h2>post title</h2>
            <h5>meta</h5>
            <div class="post-content">lorem ipsum x 1000 idk</div>
        </div>
    </div>
</body>
</html>
